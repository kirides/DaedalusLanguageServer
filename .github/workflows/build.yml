name: build and test

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

defaults:
  run:
    shell: bash

jobs:
  
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.26.x'

    - name: build all binaries
      run: go build -v ./...
    
    - name: Test
      run: go test -v ./...

  wasi:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.26.x'

    - name: Set up wasmtime
      uses: bytecodealliance/actions/wasmtime/setup@v1

    - name: build wasm/wasi
      run: GOOS=wasip1 GOARCH=wasm go build -v -o DaedalusLanguageServer.wasm ./cmd/DaedalusLanguageServer

    - name: Test (running in wasmtime)
      run: GOOS=wasip1 GOARCH=wasm GOWASIRUNTIME=wasmtime go test -exec "$(go env GOROOT)/lib/wasm/go_wasip1_wasm_exec" ./...
